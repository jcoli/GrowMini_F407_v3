; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:black_f407vg]
platform = ststm32
board = black_f407vg
board_build.mcu = stm32f407vgt6
framework = arduino
debug_tool = stlink
upload_protocol = stlink
monitor_speed = 115200
board_build.f_cpu = 168000000L
monitor_port = /dev/ttyACM0
build_flags = 
	-D USBD_USE_CDC
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D PIO_FRAMEWORK_ARDUINO_USB_FULLMODE
	-D USBCON
	-D STM32F407VGT6
	-D ARCH_STM32
	-DHAL_CAN_MODULE_ENABLED
lib_deps = 
	stm32duino/STM32duino RTC@^1.8.0
	pazi88/STM32_CAN@^1.2.2
	khoih-prog/TimerInterrupt_Generic@^1.13.0
	thomasfredericks/Bounce2@^2.72
	zerokol/eFLL@^1.4.1
	marzogh/SPIMemory@^3.4.0
	bodmer/TFT_eSPI@^2.5.43
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit SSD1306@^2.5.4
	adafruit/Adafruit GFX Library@^1.11.2
	aki237/Adafruit_ESP32_SH1106@^1.0.2
